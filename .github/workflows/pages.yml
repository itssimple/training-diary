name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Assemble site (runtime files only)
        env:
          # The live address including any custom domain, e.g. https://example.com/training-diary
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js icons vendor social _site/
          # Absolute URLs for link previews (Open Graph, X cards, canonical, JSON-LD).
          sed -i "s|__SITE_URL__|${SITE_URL%/}|g" _site/index.html
          if grep -q __SITE_URL__ _site/index.html; then echo "SITE_URL placeholder left in index.html"; exit 1; fi
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
