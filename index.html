<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Training Diary: a private, offline workout diary</title>
  <meta name="description" content="Free workout diary that works offline at the gym. Log sets, supersets and cardio in seconds, follow your programs, track progress and records. No account; your data stays on your phone.">
  <meta name="application-name" content="Training Diary">
  <!-- Brand colour: used by Discord and others for the link embed. The page switches it to the
       light/dark theme colour before first paint (see the inline script below). -->
  <meta name="theme-color" content="#b9f24c">
  <!-- Absolute URLs: __SITE_URL__ is replaced with the real address when GitHub Pages deploys
       (.github/workflows/pages.yml), so a domain change needs no edit here. -->
  <link rel="canonical" href="__SITE_URL__/">
  <!-- Open Graph: Discord, Facebook, LinkedIn, Slack, iMessage, WhatsApp, Telegram -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Training Diary">
  <meta property="og:title" content="Training Diary: a private, offline workout diary">
  <meta property="og:description" content="Log sets, supersets and cardio in seconds, follow your programs and track progress. Works without signal, installs like an app, no account. Your data stays on your phone.">
  <meta property="og:url" content="__SITE_URL__/">
  <meta property="og:image" content="__SITE_URL__/social/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Training Diary app icon and a muscle map, with the text: A private, offline workout diary.">
  <meta property="og:locale" content="en_GB">
  <!-- X (Twitter) -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Training Diary: a private, offline workout diary">
  <meta name="twitter:description" content="Log workouts in seconds, offline. Programs, supersets, cardio, progress charts and records. No account; your data stays on your phone.">
  <meta name="twitter:image" content="__SITE_URL__/social/og-image.png">
  <meta name="twitter:image:alt" content="Training Diary app icon and a muscle map, with the text: A private, offline workout diary.">
  <!-- Structured data for search engines -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Training Diary",
    "url": "__SITE_URL__/",
    "image": "__SITE_URL__/social/og-image.png",
    "description": "A free, private workout diary that works offline. Log strength training, supersets and cardio, follow programs, and track progress and personal records. Data is stored only on your device.",
    "applicationCategory": "HealthApplication",
    "applicationSubCategory": "Workout tracker",
    "operatingSystem": "Any (web browser); installable on Android, iOS and desktop",
    "browserRequirements": "Requires JavaScript and IndexedDB",
    "isAccessibleForFree": true,
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
    "featureList": ["Works offline", "Workout programs and templates", "Supersets and circuits", "Rest timer", "Cardio and activity logging", "Progress charts and personal records", "Exercise library with muscle maps", "JSON and CSV import and export", "AI coach prompts for any AI chat"]
  }
  </script>
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <!-- iOS home screen support -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Training">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      var pref = 'system';
      try { pref = localStorage.getItem('td-theme') || 'system'; } catch (e) {}
      var dark = pref === 'dark' || (pref === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#111518' : '#f4f6f3');
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body class="booting">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <nav id="nav" class="nav" aria-label="Main"></nav>
    <main id="main" tabindex="-1">
      <div id="update-banner" class="update-banner" role="status" hidden></div>
      <div id="view" class="view">
        <div class="boot" aria-live="polite">
          <img src="icons/icon.svg" alt="" width="64" height="64">
          <p>Loading your diary…</p>
        </div>
      </div>
    </main>
    <div id="active-bar" class="active-bar" hidden></div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <p id="offline-pill" class="offline-pill" hidden>Offline · everything still works</p>
  <p class="sr-only">Version <span id="app-version"></span></p>
  <noscript>
    <p class="noscript">Training Diary needs JavaScript to run. Your data is stored locally in this browser.</p>
  </noscript>
</body>
</html>
