<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Training Diary</title>
  <meta name="description" content="A private, offline-first workout diary. Your data stays on your device.">
  <meta name="theme-color" content="#f4f6f3">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <!-- iOS home screen support -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Training">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      var pref = 'system';
      try { pref = localStorage.getItem('td-theme') || 'system'; } catch (e) {}
      var dark = pref === 'dark' || (pref === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body class="booting">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <nav id="nav" class="nav" aria-label="Main"></nav>
    <main id="main" tabindex="-1">
      <div id="update-banner" class="update-banner" role="status" hidden></div>
      <div id="view" class="view">
        <div class="boot" aria-live="polite">
          <img src="icons/icon.svg" alt="" width="64" height="64">
          <p>Loading your diary…</p>
        </div>
      </div>
    </main>
    <div id="active-bar" class="active-bar" hidden></div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <p id="offline-pill" class="offline-pill" hidden>Offline · everything still works</p>
  <p class="sr-only">Version <span id="app-version"></span></p>
  <noscript>
    <p class="noscript">Training Diary needs JavaScript to run. Your data is stored locally in this browser.</p>
  </noscript>
</body>
</html>
